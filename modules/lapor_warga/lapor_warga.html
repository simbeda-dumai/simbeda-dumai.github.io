<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapor Warga — SIMBEDA</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/modules/lapor_warga/lapor_warga.css">
<script src="/js/config.js" defer></script>
<script src="/js/auth.js" defer></script>
<script src="/modules/lapor_warga/lapor_warga.js" defer></script>
</head>
<body>
  <div id="app-header"></div>
  <main class="container">
    <h1>Lapor Warga</h1>
    <form id="formWarga" class="card">
      <div class="grid">
        <label>Kecamatan
          <select id="wKec" name="kecamatan" required></select>
        </label>
        <label>Kelurahan
          <select id="wKel" name="kelurahan" required></select>
        </label>
      </div>
      <label>Jenis Laporan
        <select name="jenis" required>
          <option value="">Pilih...</option>
          <option>Banjir</option>
          <option>Kebakaran</option>
          <option>Puting Beliung</option>
          <option>Tanah Longsor</option>
          <option>Gelombang Pasang</option>
          <option>Lainnya</option>
        </select>
      </label>
      <label>Deskripsi
        <textarea name="deskripsi" rows="4" placeholder="Ceritakan kejadian secara ringkas."></textarea>
      </label>
      <div class="grid">
        <label>Nama Pelapor <input name="nama" required></label>
        <label>Kontak (WA) <input name="kontak" placeholder="08xxxxxxxxxx"></label>
      </div>
      <div class="actions"><button type="submit">Kirim Laporan</button></div>
      <p class="note">Catatan: input manual kecamatan/kelurahan dihapus. Gunakan dropdown resmi.</p>
    </form>
  </main>
  <div id="app-footer"></div>
  <script src="/js/layout/layout.js"></script>
</body>
</html>
