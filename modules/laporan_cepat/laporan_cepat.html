<form id="formLaporanCepat" class="lapor-form">
  <label for="jenisBencana">Jenis Bencana</label>
  <select id="jenisBencana" required>
    <option value="">-- Pilih Jenis --</option>
    <option>Banjir</option>
    <option>Kebakaran</option>
    <option>Tanah Longsor</option>
    <option>Angin Puting Beliung</option>
    <option>Gelombang Pasang</option>
    <option value="manual">Lainnya (Input Manual)</option>
  </select>
  <input type="text" id="jenisManual" placeholder="Tulis jenis bencana lain..." style="display:none;">

  <label for="kecamatan">Kecamatan</label>
  <select id="kecamatan" required>
    <option value="">-- Pilih Kecamatan --</option>
    <option value="Sungai Sembilan">Sungai Sembilan</option>
    <option value="Dumai Barat">Dumai Barat</option>
    <option value="Dumai Kota">Dumai Kota</option>
    <option value="Dumai Timur">Dumai Timur</option>
    <option value="Dumai Selatan">Dumai Selatan</option>
    <option value="Bukit Kapur">Bukit Kapur</option>
    <option value="Medang Kampai">Medang Kampai</option>
  </select>

  <label for="kelurahan">Kelurahan</label>
  <select id="kelurahan" required>
    <option value="">-- Pilih Kelurahan --</option>
  </select>

  <label for="lokasi">Lokasi Kejadian</label>
  <input type="text" id="lokasi" placeholder="Nama lokasi kejadian" required />

  <label for="koordinat">Titik Koordinat (Lat, Lng)</label>
  <input type="text" id="koordinat" placeholder="-1.6870, 101.4100" />

  <button type="button" onclick="ambilLokasi()">Gunakan Lokasi Saya</button>

  <label for="deskripsi">Deskripsi Singkat</label>
  <textarea id="deskripsi" placeholder="Tuliskan kondisi dan dampak singkat..." required></textarea>

  <button type="submit">Kirim Laporan</button>
</form>
