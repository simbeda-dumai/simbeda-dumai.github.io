<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Cepat | SIMBEDA Kota Dumai</title>

  <link rel="stylesheet" href="../../components/header/header.css">
  <link rel="stylesheet" href="../../components/footer/footer.css">
  <link rel="stylesheet" href="laporan_cepat.css">
  <script src="../../js/layout/layout.js" defer></script>
</head>

<body>
  <div id="header"></div>

  <main class="laporan-container">
    <h2>Laporan Cepat Bencana</h2>
    <form id="formLaporan" onsubmit="return simpanLaporan(event)">
      <label>Jenis Bencana:</label>
      <input type="text" id="jenis" placeholder="Contoh: Banjir, Kebakaran" required>

      <label>Lokasi Kejadian:</label>
      <input type="text" id="lokasi" placeholder="Nama jalan / area" required>

      <label>Deskripsi Singkat:</label>
      <textarea id="deskripsi" rows="3" placeholder="Tuliskan deskripsi kejadian"></textarea>

      <button type="submit">Kirim Laporan</button>
    </form>

    <h3>Riwayat Laporan</h3>
    <table id="tabelLog">
      <thead>
        <tr>
          <th>Waktu</th>
          <th>User</th>
          <th>Jenis</th>
          <th>Lokasi</th>
          <th>Deskripsi</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <div id="footer"></div>
  <script src="laporan_cepat.js"></script>
</body>
</html>
