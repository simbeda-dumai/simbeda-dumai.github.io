<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — SIMBEDA</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/modules/login/login.css">
<script src="/js/config.js" defer></script>
<script src="/js/auth.js" defer></script>
<script src="/modules/login/login.js" defer></script>
</head>
<body>
  <div id="app-header"></div>
  <main class="container">
    <h1>Masuk ke SIMBEDA</h1>
    <form id="formLogin" class="card" onsubmit="loginUser(event)">
      <label>Username <input id="username" required></label>
      <label>Password <input id="password" type="password" required></label>
      <button type="submit">Login</button>
      <p class="hint">Contoh akun: <code>dk / dumaisiaga</code>, <code>kalaksa / siagasatu</code></p>
    </form>
  </main>
  <div id="app-footer"></div>
  <script src="/js/layout/layout.js"></script>
</body>
</html>
