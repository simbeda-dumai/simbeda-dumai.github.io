<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Laporan Cepat | SIMBEDA Kota Dumai</title>

  <!-- Guard hanya untuk modul laporan_cepat -->
  <meta name="simbeda:module" content="laporan_cepat">
  <script src="/JS/auth-guard.js" defer></script>

  <!-- Style modul (ABSOLUTE PATH) -->
  <link rel="stylesheet" href="/CSS/laporan_cepat.css" />

  <!-- Wilayah (opsional untuk isi dropdown) -->
  <script src="/JS/config.js" defer></script>

  <!-- Layout injector: header/footer + css umum -->
  <script src="/JS/layout.js" defer></script>

  <!-- Script modul -->
  <script src="/JS/laporan_cepat.js" defer></script>
</head>
<body>
  <div id="header"></div>

  <main class="page-wrap">
    <section class="page-card">
      <h1>Laporan Cepat</h1>
      <p class="subtitle">Catat kejadian singkat untuk reaksi cepat.</p>

      <form class="form-grid" autocomplete="off">
        <div class="field">
          <label for="waktu">Waktu</label>
          <input type="datetime-local" id="waktu" />
        </div>

        <div class="field">
          <label for="kecamatan">Kecamatan</label>
          <select id="kecamatan">
            <option value="">— Pilih kecamatan —</option>
          </select>
        </div>

        <div class="field">
          <label for="kelurahan">Kelurahan</label>
          <select id="kelurahan">
            <option value="">— Pilih kelurahan —</option>
          </select>
        </div>

        <div class="field col-2">
          <label for="lokasi">Lokasi (boleh isi koordinat, mis. 1.668, 101.45)</label>
          <input type="text" id="lokasi" placeholder="Contoh: Jl. Merdeka No.1 / lat:1.67 lng:101.45" />
        </div>

        <div class="field">
          <label for="jenis">Jenis Kejadian</label>
          <input type="text" id="jenis" placeholder="Banjir / Kebakaran / Angin Kencang..." />
        </div>

        <div class="field col-2">
          <label for="deskripsi">Deskripsi Singkat</label>
          <textarea id="deskripsi" rows="4" placeholder="Ringkas, faktual, dan jelas..."></textarea>
        </div>

        <div class="actions col-2">
          <button id="btn-simpan" class="btn-primary" type="button">Simpan</button>
          <p id="msg" class="msg" role="alert" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>

  <div id="footer"></div>
</body>
</html>
