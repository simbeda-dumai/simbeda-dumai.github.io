<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Laporan Cepat | SIMBEDA Kota Dumai</title>

  <!-- Guard untuk modul laporan_cepat -->
  <meta name="simbeda:module" content="laporan_cepat">
  <script src="/JS/auth-guard.js" defer></script>

  <link rel="stylesheet" href="/CSS/laporan_cepat.css" />
  <script src="/JS/config.js" defer></script>
  <script src="/JS/layout.js" defer></script>
  <script src="/JS/laporan_cepat.js" defer></script>
</head>
<body>
  <div id="header"></div>

  <main class="page-wrap">
    <section class="page-card">
      <h1>Laporan Cepat</h1>
      <p class="subtitle">Catat kejadian singkat (role-aware + GPS + jenis manual).</p>

      <form class="form-grid" autocomplete="off">
        <div class="field">
          <label for="waktu">Waktu</label>
          <input type="datetime-local" id="waktu" />
        </div>

        <div class="field">
          <label for="kecamatan">Kecamatan</label>
          <select id="kecamatan">
            <option value="">— Pilih kecamatan —</option>
          </select>
          <small id="kec-lock" class="muted" hidden>Diunci sesuai wilayah akun.</small>
        </div>

        <div class="field">
          <label for="kelurahan">Kelurahan</label>
          <select id="kelurahan">
            <option value="">— Pilih kelurahan —</option>
          </select>
        </div>

        <div class="field col-2">
          <label for="lokasi">Lokasi (alamat/koordinat)</label>
          <div class="loc-inline">
            <input type="text" id="lokasi" placeholder="Contoh: Jl. Merdeka / lat:1.667890 lng:101.450123" />
            <button id="btn-lokasi" class="btn-secondary" type="button">Gunakan Lokasi Saya</button>
          </div>
          <small id="loc-status" class="muted"></small>
        </div>

        <!-- Tambahan: Detail Lokasi -->
        <div class="field col-2">
          <label for="detail_lokasi">Detail Lokasi (Jalan/RT)</label>
          <input type="text" id="detail_lokasi" placeholder="Contoh: Jl. Merdeka RT 02/RW 03" />
        </div>

        <div class="field">
          <label for="jenis">Jenis Kejadian</label>
          <select id="jenis" aria-controls="jenisManualWrap">
            <!-- diisi via JS -->
          </select>
        </div>

        <div id="jenisManualWrap" class="field manual-field" hidden>
          <label for="jenisManual">Tulis Jenis Kejadian</label>
          <input type="text" id="jenisManual" placeholder="Contoh: Jalan Amblas / Jembatan Rusak / dll." />
        </div>

        <div class="field col-2">
          <label for="deskripsi">Deskripsi Singkat</label>
          <textarea id="deskripsi" rows="4" placeholder="Ringkas, faktual, dan jelas..."></textarea>
        </div>

        <div class="actions col-2">
          <button id="btn-simpan" class="btn-primary" type="button">Simpan</button>
          <p id="msg" class="msg" role="alert" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>

  <div id="footer"></div>
</body>
</html>
