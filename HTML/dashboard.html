<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard | SIMBEDA Kota Dumai</title>

  <!-- TIDAK ADA meta guard di dashboard -->
  <link rel="stylesheet" href="/CSS/dashboard.css" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

  <!-- Shell & Modul -->
  <script src="/JS/layout.js" defer></script>
  <script src="/JS/dashboard.js" defer></script>
</head>
<body>
  <div id="header"></div>

  <main id="dashboard-container">
    <section class="dashboard-summary">
      <h2>Statistik Laporan</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <h3 id="totalLaporan">0</h3>
          <p>Jumlah Laporan</p>
        </div>
        <div class="stat-card">
          <h3 id="asalLaporan">0</h3>
          <p>Asal Kecamatan</p>
        </div>
        <div class="stat-card">
          <h3 id="pengunjung">0</h3>
          <p>Pengunjung</p>
        </div>
      </div>
    </section>

    <section class="dashboard-map">
      <h2>Peta Kejadian</h2>
      <div id="map"></div>
    </section>
  </main>

  <div id="footer"></div>
</body>
</html>
