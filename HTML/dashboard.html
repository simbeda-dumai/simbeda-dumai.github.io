<main id="dashboard-container">
  <section class="dashboard-summary">
    <h2>Statistik Laporan</h2>
    <div class="stats-grid">
      <div class="stat-card">
        <h3 id="totalLaporan">0</h3>
        <p>Jumlah Laporan</p>
      </div>
      <div class="stat-card">
        <h3 id="asalLaporan">0</h3>
        <p>Asal Kecamatan</p>

      <div class="stat-card">
        <h3 id="pengunjung">0</h3>
        <p>Pengunjung</p>
      </div>

  </section>

  <section class="dashboard-map">
    <h2>Peta Kejadian</h2>
    <div id="map"></div>
  </section>
</main>

<div id="footer"></div>
