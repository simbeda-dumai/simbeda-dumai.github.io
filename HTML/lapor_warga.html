<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lapor Warga | SIMBEDA Kota Dumai</title>

  <!-- TANPA guard (sesuai instruksi) -->

  <!-- Style modul -->
  <link rel="stylesheet" href="/CSS/lapor_warga.css" />

  <!-- Wilayah (opsional untuk isi dropdown) -->
  <script src="/JS/config.js" defer></script>

  <!-- Layout injector -->
  <script src="/JS/layout.js" defer></script>

  <!-- Script modul -->
  <script src="/JS/lapor_warga.js" defer></script>
</head>
<body>
  <div id="header"></div>

  <main class="page-wrap">
    <section class="page-card">
      <h1>Lapor Warga</h1>
      <p class="subtitle">Sampaikan laporan Anda. Data tersimpan lokal.</p>

      <form class="form-grid" autocomplete="off">
        <div class="field">
          <label for="waktu">Waktu</label>
          <input type="datetime-local" id="waktu" />
        </div>

        <div class="field">
          <label for="nama">Nama Pelapor</label>
          <input type="text" id="nama" placeholder="Nama lengkap" />
        </div>

        <div class="field">
          <label for="kontak">Kontak</label>
          <input type="text" id="kontak" placeholder="No HP/WA atau Email" />
        </div>

        <div class="field">
          <label for="kecamatan">Kecamatan</label>
          <select id="kecamatan">
            <option value="">— Pilih kecamatan —</option>
          </select>
        </div>

        <div class="field">
          <label for="kelurahan">Kelurahan</label>
          <select id="kelurahan">
            <option value="">— Pilih kelurahan —</option>
          </select>
        </div>

        <div class="field col-2">
          <label for="lokasi">Lokasi (boleh isi koordinat, mis. 1.668, 101.45)</label>
          <input type="text" id="lokasi" placeholder="Contoh: Gg. Melati / lat:1.66 lng:101.41" />
        </div>

        <div class="field">
          <label for="kejadian">Kejadian</label>
          <input type="text" id="kejadian" placeholder="Banjir / Kebakaran / Longsor..." />
        </div>

        <div class="field col-2">
          <label for="keterangan">Keterangan</label>
          <textarea id="keterangan" rows="4" placeholder="Lengkapi detail agar valid..."></textarea>
        </div>

        <div class="actions col-2">
          <button id="btn-kirim" class="btn-primary" type="button">Kirim</button>
          <p id="msg" class="msg" role="alert" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>

  <div id="footer"></div>
</body>
</html>
