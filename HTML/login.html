<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SIMBEDA Kota Dumai</title>

  <link rel="stylesheet" href="/assets/fonts/Roboto.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <main class="login-container">
    <div class="login-box">
      <img src="/assets/img/logo_simbeda.png" alt="Logo SIMBEDA" class="login-logo">
      <h2>SIMBEDA Kota Dumai</h2>
      <p>Sistem Informasi Manajemen Bencana Daerah</p>

      <form onsubmit="return loginUser(event)">
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Masuk</button>
      </form>
      <p class="hint">Password: <b>dumaisiaga</b></p>
    </div>
  </main>

  <script src="login.js"></script>
</body>
</html>
