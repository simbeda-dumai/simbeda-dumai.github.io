<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masuk | SIMBEDA Kota Dumai</title>
  <link rel="stylesheet" href="/CSS/Roboto.css" />
  <link rel="stylesheet" href="/CSS/login.css" />
</head>
<body>
  <main class="login-wrap">
    <section class="login-card" role="form" aria-labelledby="title">
      <img src="/IMG/logo_simbeda.png" alt="Logo SIMBEDA" class="logo" />
      <h1 id="title">SIMBEDA Kota Dumai</h1>
      <p class="subtitle">Sistem Informasi Manajemen Bencana Daerah</p>

      <div class="form">
        <label for="username">Pengguna</label>
        <input id="username" name="username" type="text" placeholder="mis. dk / dt / db" autocomplete="username" />

        <label for="password">Kata Sandi</label>
        <div class="password-row">
          <input id="password" name="password" type="password" placeholder="Kata sandi" autocomplete="current-password" />
          <button type="button" id="toggle-pass" aria-label="Tampilkan/Sembunyikan kata sandi">👁️</button>
        </div>

        <button id="btn-login" class="btn-primary">Masuk</button>
        <p id="login-msg" class="msg" role="alert" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script src="/JS/login.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const $u = document.getElementById('username');
      const $p = document.getElementById('password');
      const $b = document.getElementById('btn-login');
      const $t = document.getElementById('toggle-pass');

      $t.addEventListener('click', () => {
        $p.type = $p.type === 'password' ? 'text' : 'password';
        $t.classList.toggle('on');
      });

      const submit = () => $b.click();
      $u.addEventListener('keydown', e => (e.key === 'Enter') && submit());
      $p.addEventListener('keydown', e => (e.key === 'Enter') && submit());
    });
  </script>
</body>
</html>
